# Gitleaks configuration for MarketSnap
# See: https://github.com/gitleaks/gitleaks
title = "gitleaks config for MarketSnap"

[extend]
# Extend the default gitleaks configuration
useDefault = true

# Global allowlist for MarketSnap specific patterns
[[rules]]
id = "marketsnap-dummy-keys"
description = "MarketSnap dummy keys for CI/CD"
regex = '''dummy(-key|-project|-android|-ios)'''
keywords = ["dummy"]

# Custom rules for Flutter/Firebase projects
[[rules]]
id = "flutter-dotenv-check"
description = "Flutter .env file detection"
regex = '''(?i)(api_key|firebase_api_key|google_api_key|secret_key)\s*=\s*["\']?[A-Za-z0-9_-]{20,}["\']?'''
keywords = ["API_KEY", "SECRET_KEY", "FIREBASE_API_KEY"]
path = '''\.env.*'''

[[rules]]
id = "firebase-service-account"
description = "Firebase service account key"
regex = '''(?i)"private_key":\s*"-----BEGIN PRIVATE KEY-----'''
keywords = ["private_key", "service_account"]

[[rules]]
id = "google-services-json"
description = "Google Services JSON configuration"
regex = '''(?i)"api_key":\s*"[A-Za-z0-9_-]{39}"'''
keywords = ["google_services", "api_key"]
path = '''google-services\.json'''

# Allowlist for common false positives
[[allowlists]]
description = "Allowlist for MarketSnap development"
paths = [
    '''env\.example''',
    '''\.env\.example''',
    '''\.env\.template''',
    '''test/.*''',
    '''tests/.*''',
    '''example/.*''',
    '''docs/.*''',
    '''documentation/.*''',
    '''README\.md''',
    '''\.cursorrules''',
    '''\.pre-commit-config\.yaml''',
    '''\.gitleaks\.toml''',
    '''pubspec\.yaml''',
    '''pubspec\.lock''',
    '''analysis_options\.yaml''',
    '''firebase\.json\.template''',
    '''functions/package\.json''',
    '''functions/package-lock\.json''',
    '''android/app/build\.gradle.*''',
    '''ios/Runner\.xcodeproj/.*''',
    '''ios/Runner/Info\.plist''',
    '''ios/Podfile\.lock''',
    '''macos/Podfile\.lock''',
    '''ios/Pods/.*''',
    '''macos/Pods/.*''',
    '''android/app/src/main/AndroidManifest\.xml''',
    '''lib/firebase_options\.dart''',
    '''assets/.*''',
    '''coverage/.*''',
    '''build/.*''',
    '''\.dart_tool/.*''',
    '''\.flutter-plugins.*''',
    '''\.packages''',
    '''\.metadata''',
    '''\.gitignore''',
    '''memory_bank/.*''',
    '''backup.*''',
    '''scripts/.*''',
    '''\.github/workflows/.*''',
    '''.*\.log''',
    '''.*_log\.txt''',
